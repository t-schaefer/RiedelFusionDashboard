# docker compose -f deploy/docker-compose.yml up -d --build
# DEMO_HOST = the public name (DNS A record -> this server's IPv4). Default: tools-fusion.tsquared.de
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always                 # also what turns the 30-minute reset into a fresh demo
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [web]                 # reachable only through Caddy, no published port
  caddy:
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DEMO_HOST: ${DEMO_HOST:-tools-fusion.tsquared.de}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    networks: [web]
networks:
  web: {}
volumes:
  caddy_data: {}
