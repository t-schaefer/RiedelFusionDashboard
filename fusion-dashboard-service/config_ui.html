<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expert Config - Fusion Dashboard</title>
<link rel="stylesheet" href="/app.css">
<style>
  main { max-width: 1000px; margin: 0 auto; padding: 18px 16px 90px; }
  .subbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; font-size: 13px; }
  .subbar .sp { flex: 1; }
  .card h2 { margin: 0 0 4px; font-size: 20px; }
  .card h3 { margin: 18px 0 6px; font-size: 15px; }
  .why { color: var(--muted); margin: 0 0 14px; }
  .stepper { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .stepper .s { flex: 1; min-width: 150px; text-align: left; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .stepper .s .n { font-size: 12px; color: var(--muted); } .stepper .s .t { font-weight: 600; }
  .stepper .s.done { border-color: var(--ok-strong); background: var(--ok-soft); }
  .stepper .s.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .stepper .s.locked { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td input[type=text], td select { width: 100%; min-width: 120px; }
  td input.set, td select.set { border-color: var(--accent); background: var(--accent-soft); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }
  .tag.danger { background: var(--bad-soft); color: var(--bad); } .tag.unv { background: var(--warn-soft); color: var(--warn); }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .navrow { display: flex; gap: 10px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); align-items: center; }
  .navrow .sp { flex: 1; }
  label.plain { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 14px 0 0; }
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .topic { text-align: left; padding: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); display: block; width: 100%; }
  .topic:hover { border-color: var(--accent); }
  .topic .t { font-weight: 700; } .topic .d { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .topic .n { float: right; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 10px; background: var(--accent); color: var(--on-accent); }
  .devrow { cursor: pointer; } .devrow:hover td { background: var(--hover); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .chips button { padding: 3px 11px; font-size: 13px; border-radius: 14px; }
  .pendbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.25); }
  .pendbar .sp { flex: 1; }
  .scroll { overflow-x: auto; }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .dev-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-top: 18px; }
  .dev-h b { font-size: 15px; }
  .errbar { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 60; max-width: min(720px, calc(100vw - 32px)); display: flex; gap: 12px; align-items: flex-start;
    background: var(--bad-soft); color: var(--text); border: 1px solid var(--bad-strong); border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .errbar button { padding: 0 8px; font-size: 18px; line-height: 1.2; }
  .spin::after { content: ""; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (max-width: 640px) { th:nth-child(n+4), td:nth-child(n+4) { } .stepper .s { min-width: 100px; } }
</style>
</head>
<body>
<div id="appNav"></div>
<main>
  <div class="subbar"><span class="muted">Change settings on devices that are already running.</span><span class="sp"></span>
    <span class="muted">Setting up a new device? <a href="/guide">Open New device</a></span> &middot; <a href="/config/advanced">Advanced editor</a> <span class="muted small">(profiles, everything at once)</span></div>
  <div id="main"></div>
  <a id="logout" class="hidden"></a>
</main>
<div id="pend" class="pendbar hidden"></div>
<script src="/app-nav.js"></script>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const show = (v) => (v === null || v === undefined || v === "") ? "-" : (typeof v === "boolean" ? (v ? "on" : "off") : (typeof v === "object" ? JSON.stringify(v) : String(v)));

let CAT = [], SCOPES = {}, DEVICES = [], READS = {}, MODE = {};
const S = { step: "devices", sel: new Set(), filter: "", topic: null, vals: {}, ovr: {}, plan: null, results: null, failed: {} };

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (res.status === 401 || (res.redirected && /login/.test(res.url))) { location.href = "/config/login"; throw new Error("login required"); }
  const data = await res.json().catch(() => ({ ok: false, error: "HTTP " + res.status }));
  if (!res.ok || data.ok === false) throw new Error(data.error || "HTTP " + res.status);
  return data;
}
function showError(msg) {
  let b = $("#errBar");
  if (!b) { b = document.createElement("div"); b.id = "errBar"; b.className = "errbar"; document.body.appendChild(b); }
  b.innerHTML = `<span>${esc(msg)}</span><button class="ghost" id="errX" title="Dismiss">&times;</button>`;
  $("#errX").onclick = clearError;
}
function clearError() { const b = $("#errBar"); if (b) b.remove(); }
function busy(on, msg) {
  const b = $("#busy"); if (b) b.innerHTML = on ? `<span class="spin">${esc(msg || "Working")}</span>` : "";
  document.querySelectorAll("#main button, #pend button").forEach(x => {
    if (on) { x.dataset.was = x.disabled ? "1" : "0"; x.disabled = true; }
    else if (x.dataset.was !== undefined) { x.disabled = x.dataset.was === "1"; delete x.dataset.was; }
  });
}
async function run(msg, fn) { clearError(); busy(true, msg); try { await fn(); } catch (e) { showError(e.message); } finally { busy(false); } }

// ------------------------------------------------------------------ topics (the catalog groups, in plain words)
const TOPICS = [
  { id: "net", title: "Name & network", desc: "Hostname, Red / Blue address, VLAN, static routes", groups: ["Identity & network", "Static routes"],
    note: "Addresses belong to one device. A wrong value can make a device unreachable - check the next step carefully." },
  { id: "ptp", title: "Time (PTP)", desc: "PTP mode, domain, timing", groups: ["PTP"] },
  { id: "syslog", title: "Syslog", desc: "Where the device sends its log and which events it reports", groups: ["Syslog", "Syslog monitoring"], advanced: ["Syslog monitoring"] },
  { id: "nmos", title: "NMOS registration", desc: "Registry address, DNS, discovery", groups: ["NMOS registration"] },
  { id: "sys", title: "System & protocols", desc: "IGMP version, ST 2022-7 class, LLDP, FEC, SDI bit rate", groups: ["System"] },
  { id: "sdi", title: "SDI outputs", desc: "Loss-of-input behaviour, VPID, line offsets, colour bars", groups: ["SDI output"] },
  { id: "audio", title: "SDI audio mapping", desc: "Which audio goes on which embedded channel", groups: ["SDI audio map"] },
  { id: "cs", title: "Clean switch", desc: "Seamless switching per channel", groups: ["Clean switch"] },
  { id: "flow", title: "Streams (flows)", desc: "Addresses, ports, enable, filters of the streams", groups: ["Flow", "Flow format"], advanced: ["Flow format"] },
  { id: "port", title: "SFP ports", desc: "Port type and pin-out (Fusion)", groups: ["SFP port"] },
];
function topicsList() {
  const known = new Set(TOPICS.flatMap(t => t.groups)), other = [...new Set(CAT.map(s => s.group))].filter(g => !known.has(g));
  return other.length ? TOPICS.concat([{ id: "other", title: "Other", desc: "Everything else", groups: other }]) : TOPICS;
}

// ------------------------------------------------------------------ selected devices / current values
const selIps = () => [...S.sel].filter(ip => READS[ip] && READS[ip].current);
const devName = (ip) => { const d = DEVICES.find(x => x.ip === ip); return (d && d.name) || (READS[ip] && READS[ip].summary && READS[ip].summary.hostname) || ip; };
function nowVals(s, ips) {
  const out = [];
  ips.forEach(ip => {
    const c = READS[ip].current;
    if (s.scope === "device") { if (s.id in c.values) out.push({ ip, inst: null, v: c.values[s.id] }); }
    else Object.entries((c.io || {})[s.scope] || {}).forEach(([inst, m]) => { if (s.id in m) out.push({ ip, inst, v: m[s.id] }); });
  });
  return out;
}
function nowCell(list) {
  const u = [...new Set(list.map(x => JSON.stringify(x.v)))];
  if (u.length === 1) return `<span class="mono">${esc(show(list[0].v))}</span>`;
  const tip = list.slice(0, 40).map(x => (x.inst ? devName(x.ip) + " / " + x.inst : devName(x.ip)) + ": " + show(x.v)).join("\n");
  return `<span class="muted" title="${esc(tip)}">differs (${u.length} values)</span>`;
}

// ------------------------------------------------------------------ what the engineer typed
function getVal(a, sid) {
  if (a.k === "all") return S.vals[sid];
  const o = S.ovr[a.ip] || {};
  return a.k === "dev" ? (o.values || {})[sid] : (((o.io || {})[a.scope] || {})[a.inst] || {})[sid];
}
function setVal(a, sid, v) {
  if (a.k === "all") { if (v === "") delete S.vals[sid]; else S.vals[sid] = v; return; }
  const o = S.ovr[a.ip] = S.ovr[a.ip] || { values: {}, io: {} };
  if (a.k === "dev") { if (v === "") delete o.values[sid]; else o.values[sid] = v; return; }
  const sc = o.io[a.scope] = o.io[a.scope] || {}, m = sc[a.inst] = sc[a.inst] || {};
  if (v === "") delete m[sid]; else m[sid] = v;
  if (!Object.keys(m).length) delete sc[a.inst];
  if (!Object.keys(sc).length) delete o.io[a.scope];
}
function pendingIn(ids) {      // number of typed values (for the selected devices), optionally only for some setting ids
  const ok = (sid) => !ids || ids.has(sid), ips = new Set(selIps());
  let n = Object.keys(S.vals).filter(ok).length;
  ips.forEach(ip => { const o = S.ovr[ip]; if (!o) return;
    n += Object.keys(o.values || {}).filter(ok).length;
    Object.values(o.io || {}).forEach(sc => Object.values(sc).forEach(m => { n += Object.keys(m).filter(ok).length; })); });
  return n;
}
function cellInput(s, a, ph) {
  const v = getVal(a, s.id), attrs = `data-k="${a.k}" data-sid="${esc(s.id)}" data-ip="${esc(a.ip || "")}" data-scope="${esc(a.scope || "")}" data-inst="${esc(a.inst ?? "")}"`;
  const cls = v !== undefined && v !== "" ? " set" : "";
  if (s.type === "bool" || s.type === "bool01")
    return `<select class="${cls}" ${attrs}><option value="">no change</option><option value="on"${v === "on" ? " selected" : ""}>on</option><option value="off"${v === "off" ? " selected" : ""}>off</option></select>`;
  if (s.type === "enum")
    return `<select class="${cls}" ${attrs}><option value="">no change</option>` + (s.options || []).map(o => `<option value="${esc(o)}"${String(v) === String(o) ? " selected" : ""}>${esc(o)}</option>`).join("") + `</select>`;
  return `<input type="text" class="${cls}" ${attrs} value="${esc(v ?? "")}" placeholder="${esc(ph ?? "no change")}">`;
}
document.addEventListener("input", onEdit); document.addEventListener("change", onEdit);
function onEdit(e) {
  const t = e.target; if (!t.dataset || !t.dataset.k) return;
  const v = t.value.trim();
  setVal({ k: t.dataset.k, ip: t.dataset.ip, scope: t.dataset.scope, inst: t.dataset.inst }, t.dataset.sid, v);
  t.classList.toggle("set", v !== ""); drawPending();
}

// ------------------------------------------------------------------ frame: steps, back / next
const STEPS = [["devices", "Devices", "Pick the devices"], ["change", "What to change", "Pick a topic and type new values"], ["review", "Review & write", "Check, then write"]];
function stepper() {
  const can = { devices: true, change: selIps().length > 0, review: pendingIn() > 0 };
  return `<div class="stepper">` + STEPS.map(([id, t, sub], i) => `<button class="s${S.step === id ? " active" : ""}${can[id] ? "" : " locked"}${S.results && id === "review" ? " done" : ""}" data-go="${id}" ${can[id] ? "" : "disabled"}><div class="n">Step ${i + 1}</div><div class="t">${t}</div></button>`).join("") + `</div>`;
}
function navRow(back, next, nextLabel, nextOff) {
  return `<div class="navrow">${back ? `<button id="navBack">&larr; Back</button>` : ""}<span class="sp"></span><span id="busy" class="small muted"></span>${next ? `<button class="primary" id="navNext" ${nextOff ? "disabled" : ""}>${nextLabel || "Next"} &rarr;</button>` : ""}</div>`;
}
function frame(title, why, body, nav) {
  $("#main").innerHTML = stepper() + `<div class="card"><h2>${title}</h2><p class="why">${why}</p>${body}${nav}</div>`;
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  drawPending();
}
function go(step) { S.step = step; if (step === "change") S.topic = null; clearError(); render(); window.scrollTo(0, 0); }
function drawPending() {
  const p = $("#pend"), n = pendingIn(), onChange = S.step === "change";
  if (!onChange) { p.classList.add("hidden"); return; }
  p.classList.remove("hidden");
  p.innerHTML = `<b>${n}</b> <span>${n === 1 ? "value" : "values"} typed on ${selIps().length} device(s)</span><span class="sp"></span>` +
    (n ? `<button class="ghost" id="pClear">Clear all</button>` : "") + `<button class="primary" id="pGo" ${n ? "" : "disabled"}>Review &amp; write &rarr;</button>`;
  const g = $("#pGo"); if (g) g.onclick = () => run("Checking against the devices", toReview);
  const c = $("#pClear"); if (c) c.onclick = () => { S.vals = {}; S.ovr = {}; render(); };
  document.querySelectorAll(".topic .n").forEach(x => { x.textContent = pendingIn(new Set(CAT.filter(s => (x.dataset.groups || "").split("|").includes(s.group)).map(s => s.id))); x.classList.toggle("hidden", !+x.textContent); });
  const nx = $("#navNext"); if (nx && S.step === "devices") nx.disabled = !S.sel.size;
}
function render() {
  if (S.step === "devices") return renderDevices();
  if (S.step === "change") return S.topic ? renderTopic(S.topic) : renderTopics();
  return renderReview();
}

// ------------------------------------------------------------------ step 1: devices
function renderDevices() {
  const q = S.filter.toLowerCase();
  const shown = DEVICES.filter(d => !q || [d.name, d.ip, d.tag, d.type].some(x => String(x || "").toLowerCase().includes(q)));
  const groups = (MODE.groups || []);
  const chips = groups.length ? `<div class="chips"><span class="muted small">Select:</span>` + groups.map((g, i) => `<button class="ghost" data-grp="${i}">${esc(g.label)}</button>`).join("") + `</div>` : "";
  const rows = shown.map(d => {
    const r = READS[d.ip], bad = S.failed[d.ip];
    return `<tr class="devrow" data-ip="${esc(d.ip)}"><td><input type="checkbox" ${S.sel.has(d.ip) ? "checked" : ""}></td><td><b>${esc(d.name || d.ip)}</b><div class="muted small">${esc(d.ip)}${d.tag ? " &middot; " + esc(d.tag) : ""}</div></td>
      <td>${r && r.summary ? esc(r.summary.baseType || r.summary.type || "-") + " <span class='muted small'>" + esc(r.summary.firmware || "") + "</span>" : '<span class="muted">-</span>'}</td>
      <td>${bad ? `<span class="bad small" title="${esc(bad)}">cannot read</span>` : r ? '<span class="ok small">read</span>' : ""}</td></tr>`;
  }).join("");
  frame("1. Which devices?", "Tick the devices you want to change. They are read when you continue, so you always see their real values.",
    `<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><input type="text" id="flt" placeholder="Filter by name, address, tag..." value="${esc(S.filter)}" style="flex:1;min-width:200px">
      <button id="all">Select all shown</button><button id="none" class="ghost">None</button></div>${chips}
     <table><thead><tr><th style="width:34px"></th><th>Device</th><th>Type / firmware</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4" class="muted">No devices. Add them in the dashboard or with New device.</td></tr>'}</tbody></table>
     <p class="muted small" id="selInfo"></p>`,
    navRow(false, true, "Read and continue", !S.sel.size));
  const info = () => { $("#selInfo").textContent = S.sel.size ? S.sel.size + " device(s) selected" : "Nothing selected yet."; const nx = $("#navNext"); if (nx) nx.disabled = !S.sel.size; };
  info();
  $("#flt").oninput = (e) => { S.filter = e.target.value; const pos = e.target.selectionStart; renderDevices(); const f = $("#flt"); f.focus(); f.setSelectionRange(pos, pos); };
  $("#all").onclick = () => { shown.forEach(d => S.sel.add(d.ip)); renderDevices(); };
  $("#none").onclick = () => { S.sel.clear(); renderDevices(); };
  document.querySelectorAll("[data-grp]").forEach(b => b.onclick = () => { const re = new RegExp(groups[+b.dataset.grp].re, "i"); DEVICES.filter(d => re.test(d.name || "")).forEach(d => S.sel.add(d.ip)); renderDevices(); });
  document.querySelectorAll(".devrow").forEach(tr => tr.onclick = (e) => { const ip = tr.dataset.ip, cb = tr.querySelector("input"); if (e.target !== cb) cb.checked = !cb.checked; cb.checked ? S.sel.add(ip) : S.sel.delete(ip); info(); });
  $("#navNext").onclick = () => run("Reading the devices", async () => {
    const ips = [...S.sel], r = await api("/api/config/read", { ips });
    S.failed = {}; Object.entries(r.results).forEach(([ip, x]) => { if (!x.ok) S.failed[ip] = x.error; });
    await loadDevices();
    S.sel = new Set([...S.sel].filter(ip => !S.failed[ip]));
    const bad = Object.keys(S.failed);
    if (!S.sel.size) { renderDevices(); throw new Error("None of the selected devices could be read: " + bad.map(ip => devName(ip) + " (" + S.failed[ip] + ")").join("; ")); }
    if (bad.length) showError(bad.length + " device(s) could not be read and were left out: " + bad.map(devName).join(", "));
    go("change");
  });
}

// ------------------------------------------------------------------ step 2: topics and values
function renderTopics() {
  const ips = selIps();
  frame("2. What do you want to change?", `Selected: ${ips.map(devName).map(esc).join(", ")}. Open a topic, type new values - empty fields stay as they are.`,
    `<div class="topics">` + topicsList().map(t => {
      const ids = new Set(CAT.filter(s => t.groups.includes(s.group)).map(s => s.id));
      const has = CAT.some(s => ids.has(s.id) && nowVals(s, ips).length);
      return has ? `<button class="topic" data-t="${t.id}"><span class="n hidden" data-groups="${esc(t.groups.join("|"))}">0</span><div class="t">${esc(t.title)}</div><div class="d">${esc(t.desc)}</div></button>` : "";
    }).join("") + `</div>`,
    navRow(true, false));
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { S.topic = b.dataset.t; clearError(); render(); window.scrollTo(0, 0); });
  $("#navBack").onclick = () => go("devices");
}
function renderTopic(id) {
  const topic = topicsList().find(t => t.id === id), ips = selIps(), single = ips.length === 1;
  const adv = new Set(topic.advanced || []);
  const sets = CAT.filter(s => topic.groups.includes(s.group)).filter(s => nowVals(s, ips).length);
  const tag = (s) => (s.danger ? '<span class="tag danger" title="Can interrupt a device or a signal">careful</span>' : "") + (s.evidence === "api" ? '<span class="tag unv" title="Write not yet confirmed on a unit - try one device first">untested</span>' : "");
  const lbl = (s) => `${esc(s.label)}${tag(s)}${s.help ? `<div class="muted small">${esc(s.help)}</div>` : ""}`;
  // one row per setting that can be typed once for all selected devices / instances
  const rowFor = (s) => {
    const list = nowVals(s, ips), io = s.scope !== "device";
    let cell;
    if (!s.batch && !single) cell = `<span class="muted small">select one device to change this</span>`;
    else if (!s.batch && io) return "";          // per-instance only: lives in the table below
    else cell = cellInput(s, { k: s.batch ? "all" : "dev", ip: ips[0] });
    return `<tr><td>${lbl(s)}</td><td>${nowCell(list)}</td><td>${cell}</td></tr>`;
  };
  const block = (g) => {
    const rows = sets.filter(s => s.group === g).map(rowFor).join("");
    if (!rows) return "";
    const t = `<table><thead><tr><th style="width:38%">Setting</th><th>Now</th><th style="width:34%">Change to</th></tr></thead><tbody>${rows}</tbody></table>`;
    return adv.has(g) ? `<details><summary>${esc(g)} (advanced)</summary>${t}</details>` : (topic.groups.length > 1 ? `<h3>${esc(g)}</h3>` : "") + t;
  };
  let body = (topic.note ? `<div class="box warn small">${esc(topic.note)}</div>` : "") + topic.groups.map(block).join("");
  // per-instance table (one device only)
  const scopes = [...new Set(sets.filter(s => s.scope !== "device").map(s => s.scope))];
  scopes.forEach(sc => {
    const cols = sets.filter(s => s.scope === sc), ip = ips[0], insts = Object.keys(((READS[ip] || {}).current || { io: {} }).io[sc] || {});
    const only = cols.every(s => !s.batch), n = insts.length;
    if (!single) { if (only) body += `<div class="box info small">${esc(SCOPES[sc] || sc)} are set one device at a time. Go back and select a single device.</div>`; return; }
    const head = `<tr><th>${esc((SCOPES[sc] || sc))}</th>` + cols.map(s => `<th>${esc(s.label)}${tag(s)}</th>`).join("") + "</tr>";
    const rows = insts.map(inst => `<tr><td><b>${esc(inst)}</b></td>` + cols.map(s => { const c = nowVals(s, ips).find(x => x.inst === inst); return `<td>${c ? cellInput(s, { k: "inst", ip, scope: sc, inst }, show(c.v)) : '<span class="muted">-</span>'}</td>`; }).join("") + "</tr>").join("");
    body += `<details ${only ? "open" : ""}><summary>${only ? "" : "Different value per "}${esc(SCOPES[sc] || sc)} (${n})</summary><div class="scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div></details>`;
  });
  if (!body.replace(/<div class="box[^]*?<\/div>/, "").trim()) body += `<p class="muted">Nothing in this topic can be changed on the selected devices.</p>`;
  frame("2. " + esc(topic.title), esc(topic.desc) + ". Leave a field empty to keep the current value.", body, navRow(true, false));
  $("#navBack").onclick = () => { S.topic = null; render(); window.scrollTo(0, 0); };
  $("#navBack").textContent = "← All topics";
}

// ------------------------------------------------------------------ step 3: review and write
function profileBody() {
  const ips = selIps(), overrides = {};
  ips.forEach(ip => { if (S.ovr[ip] && (Object.keys(S.ovr[ip].values || {}).length || Object.keys(S.ovr[ip].io || {}).length)) overrides[ip] = S.ovr[ip]; });
  return { ips, profile: { values: S.vals }, overrides };
}
async function toReview() {
  const r = await api("/api/config/plan", profileBody());
  S.plan = r.plan; S.results = null; S.step = "review"; render(); window.scrollTo(0, 0);
}
const rowLine = (r, withResult) => `<tr><td>${esc(r.label)}${r.instance ? ` <span class="muted small">&middot; ${esc(r.instance)}</span>` : ""}${r.danger ? '<span class="tag danger">careful</span>' : ""}</td><td class="mono">${esc(show(r.current))}</td><td class="mono"><b>${esc(show(r.desired))}</b></td>` +
  (withResult ? `<td>${r.verify === "ok" ? '<span class="ok">&#10003; confirmed</span>' : `<span class="bad">${esc(r.verify || "not confirmed")}${r.readback !== undefined && r.readback !== null ? " (device says " + esc(show(r.readback)) + ")" : ""}</span>`}</td>` : "") + "</tr>";
function renderReview() {
  if (S.results) return renderResults();
  const plan = S.plan || {}, ips = Object.keys(plan);
  let total = 0, dangerous = 0, parts = "";
  ips.forEach(ip => {
    const p = plan[ip];
    if (p.error) { parts += `<div class="dev-h"><b>${esc(devName(ip))}</b></div><div class="box bad">${esc(p.error)}</div>`; return; }
    const ch = p.rows.filter(r => r.status === "change"), same = p.rows.filter(r => r.status === "unchanged").length;
    const bad = p.rows.filter(r => r.status === "invalid"), uns = p.rows.filter(r => r.status === "unsupported").length;
    total += ch.length; dangerous += ch.filter(r => r.danger).length;
    parts += `<div class="dev-h"><b>${esc(devName(ip))}</b><span class="muted small">${esc(ip)}</span><span class="small ${ch.length ? "" : "muted"}">${ch.length} change(s)</span></div>`;
    if (ch.length) parts += `<div class="scroll"><table><thead><tr><th>Setting</th><th>Now</th><th>New value</th></tr></thead><tbody>${ch.slice(0, 300).map(r => rowLine(r)).join("")}</tbody></table></div>${ch.length > 300 ? `<p class="muted small">... and ${ch.length - 300} more.</p>` : ""}`;
    else if (!bad.length) parts += `<p class="muted small">Nothing to change - already set that way.</p>`;
    if (same) parts += `<p class="muted small">${same} value(s) already correct.</p>`;
    if (uns) parts += `<p class="muted small">${uns} value(s) skipped: this device does not have that setting.</p>`;
    if (bad.length) parts += `<div class="box bad">${bad.map(r => esc(r.label) + ": " + esc(r.error)).join("<br>")}</div>`;
  });
  const dev = ips.filter(ip => plan[ip].rows && plan[ip].rows.some(r => r.status === "change")).length;
  S.writeIps = ips.filter(ip => plan[ip].rows && plan[ip].rows.some(r => r.status === "change"));
  frame("3. Check, then write", total ? `${total} change(s) on ${dev} device(s). Nothing has been written yet.` : "Nothing would change.",
    (dangerous ? `<div class="box warn"><b>${dangerous} careful setting(s)</b> (marked red): a mistake here can make a device unreachable or interrupt a signal. A backup of every device is saved before writing.</div>` : "") + parts +
    (total ? `<label class="plain"><input type="checkbox" id="sure"> I have checked the list and want to write these ${total} change(s) to ${dev} device(s).</label>
      <div class="actions"><button class="danger" id="write" disabled>Write to devices</button><span id="busy" class="small muted"></span></div>` : `<div class="box ok">Nothing to write.</div>`),
    `<div class="navrow"><button id="navBack">&larr; Back to the topics</button><span class="sp"></span></div>`);
  $("#navBack").onclick = () => go("change");
  const sure = $("#sure"), w = $("#write");
  if (sure) { sure.onchange = () => { w.disabled = !sure.checked; w.dataset.was = sure.checked ? "0" : "1"; }; w.dataset.was = "1"; }
  if (w) w.onclick = () => { if (!sure.checked) return showError("Please tick the box to confirm."); run("Writing and reading back - this can take a minute", async () => {
    const b = profileBody(); b.ips = S.writeIps; b.confirm = "APPLY";
    const r = await api("/api/config/apply", b);
    S.results = r.results; await api("/api/config/read", { ips: b.ips }).catch(() => {}); await loadDevices(); renderResults(); window.scrollTo(0, 0); }); };
}
function renderResults() {
  let ok = 0, all = 0, parts = "";
  Object.entries(S.results).forEach(([ip, r]) => {
    parts += `<div class="dev-h"><b>${esc(devName(ip))}</b><span class="muted small">${esc(ip)}</span></div>`;
    if (r.error) { parts += `<div class="box bad">${esc(r.error)}</div>`; return; }
    const ch = r.rows.filter(x => x.status === "change"), good = ch.filter(x => x.verify === "ok");
    ok += good.length; all += ch.length;
    const failedPosts = (r.posts || []).filter(p => !p.ok);
    parts += `<div class="box ${good.length === ch.length && !failedPosts.length ? "ok" : "bad"}">${good.length === ch.length && !failedPosts.length ? "&#10003; All " + ch.length + " value(s) were read back and confirmed." : good.length + " of " + ch.length + " value(s) confirmed. See below."}${r.rebooted ? "<br>The device restarted while applying (normal for some settings)." : ""}${r.backup ? `<div class="small muted">Backup of the old values: ${esc(r.backup)}</div>` : ""}</div>`;
    if (failedPosts.length) parts += `<div class="box bad small">${failedPosts.map(p => "Write to " + esc(p.path) + " failed: " + esc(p.response || p.status)).join("<br>")}</div>`;
    parts += `<details ${good.length === ch.length ? "" : "open"}><summary>Details</summary><div class="scroll"><table><thead><tr><th>Setting</th><th>Was</th><th>Now</th><th>Result</th></tr></thead><tbody>${ch.map(x => rowLine(x, true)).join("")}</tbody></table></div></details>`;
  });
  frame("Done", `${ok} of ${all} value(s) confirmed on the devices.`, parts,
    `<div class="navrow"><button id="more">Change something else</button><span class="sp"></span><a class="btn primary" href="/">Open the dashboard</a></div>`);
  $("#more").onclick = () => { S.vals = {}; S.ovr = {}; S.plan = null; S.results = null; S.topic = null; go("change"); };
}

// ------------------------------------------------------------------ start
async function loadDevices() {
  const d = await api("/api/config/devices");
  DEVICES = d.devices || []; READS = d.reads || {};
}
(async function init() {
  try {
    const [c, m] = await Promise.all([api("/api/config/catalog"), fetch("/api/mode").then(r => r.json()).catch(() => ({}))]);
    CAT = c.catalog; SCOPES = c.scopes; MODE = m;
    await loadDevices();
    render();
  } catch (e) { $("#main").innerHTML = `<div class="card"><div class="box bad">${esc(e.message)}</div></div>`; }
})();
</script>
</body>
</html>
